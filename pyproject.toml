[project]
name = "artificial_world"
version = "0.1.0"
description = "Django and Vue foundation for Artificial World"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "pre-commit>=4.6.0",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.dev_pytest"
testpaths = ["backend"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true
skip-magic-trailing-comma = false
line-ending = "auto"
exclude = [
    "**/migrations/*"
]

[tool.ruff.lint]
fixable = ["ALL"]
select = [
    "A",
    "B",
    "COM",
    "C90",
    "DJ",
    "DTZ",
    "E",
    "EM",
    "F",
    "FA",
    "FBT",
    "G",
    "ICN",
    "INT",
    "LOG",
    "PIE",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "SLF",
    "TCH",
    "TID",
    "W",
]

ignore = [
    "W191",
    "EM101",
    "Q000",
    "Q003",
    "COM812",
    "COM819",
    "G004",
    "DJ001",
    "B904",
    "C901",
    "PLR0912",
    "FBT001",
    "FBT002",
    "PLR0913",
    "SLF001",
    "DJ012",
    "PLR0911",
    "PLR0915",
]


[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["ALL"]
"**/tests/*" = ["PLR2004"]
"**/manage.py" = ["PLC0415"]

[tool.ruff.lint.isort]
known-third-party = [
    "django",
    "pytest",
    "rest_framework",
]
known-first-party = []

[tool.isort]
line_length = 120
line_ending = "\n"
indent = "\t"
known_third_party = [
    "django",
    "pytest",
    "rest_framework",
]
known_first_party = []
multi_line_output = 3
use_parentheses = true
include_trailing_comma = true
ensure_newline_before_comments = true
group_by_package = true
force_alphabetical_sort_within_sections = true
