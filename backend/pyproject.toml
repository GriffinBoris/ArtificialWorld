[project]
name = "backend"
version = "0.1.0"
description = "Artificial World Django backend"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.6",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.29.0",
    "drf-standardized-errors>=0.16.0",
    "panda3d==1.10.16",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim[openai]>=2.64.0,<3",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "coverage>=7.14.2",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
]

[tool.coverage.run]
data_file = "../coverage/.coverage"
branch = true
source = [
    "./",
]

omit = [
	"**/test_*",
	"**/tests.py",
	"**/asgi.py",
	"**/wsgi.py",
	"**/migrations/*",
	"**/commands/*",
	"**/settings/*",
	"**/admin.py",
	"**/manage.py",
]

[tool.coverage.report]
precision = 2
skip_empty = true
skip_covered = true
exclude_also = [
    'def __repr__',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    'if typing.TYPE_CHECKING:',
    '@(abc\.)?abstractmethod',
]

[tool.coverage.html]
skip_empty = true
skip_covered = true
directory = "../coverage/reports/html"
title = "Artificial World Test Coverage"
